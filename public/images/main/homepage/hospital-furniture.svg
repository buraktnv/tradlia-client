<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Hospital Furniture - Adjustable bed -->
  <rect x="20" y="20" width="160" height="160" rx="15" fill="#f0f9ff" stroke="#4CBEC5" stroke-width="3"/>
  <!-- Bed frame -->
  <rect x="30" y="90" width="140" height="60" rx="5" fill="#e0f7fa" stroke="#4CBEC5" stroke-width="3"/>
  <!-- Mattress -->
  <rect x="35" y="95" width="130" height="50" rx="3" fill="#ffffff" stroke="#4CBEC5" stroke-width="1"/>
  <!-- Head section adjustable -->
  <rect x="35" y="95" width="65" height="35" rx="3" fill="#e0f7fa" stroke="#4CBEC5" stroke-width="1"/>
  <!-- Foot section adjustable -->
  <rect x="100" y="115" width="65" height="30" rx="3" fill="#e0f7fa" stroke="#4CBEC5" stroke-width="1"/>
  <!-- Side rails -->
  <rect x="25" y="95" width="10" height="50" rx="3" fill="#4CBEC5" opacity="0.5"/>
  <rect x="165" y="95" width="10" height="50" rx="3" fill="#4CBEC5" opacity="0.5"/>
  <!-- Wheels -->
  <circle cx="50" cy="155" r="8" fill="#4CBEC5" opacity="0.5"/>
  <circle cx="150" cy="155" r="8" fill="#4CBEC5" opacity="0.5"/>
  <circle cx="50" cy="155" r="4" fill="#4CBEC5"/>
  <circle cx="150" cy="155" r="4" fill="#4CBEC5"/>
  <!-- IV pole -->
  <line x1="170" y1="90" x2="170" y2="40" stroke="#4CBEC5" stroke-width="4" stroke-linecap="round"/>
  <circle cx="170" cy="40" r="8" fill="none" stroke="#4CBEC5" stroke-width="3"/>
  <circle cx="170" cy="40" r="3" fill="#4CBEC5"/>
  <!-- IV bag -->
  <rect x="175" y="50" width="15" height="25" rx="2" fill="#e0f7fa" stroke="#4CBEC5" stroke-width="1"/>
  <line x1="177" y1="50" x2="177" y2="90" stroke="#4CBEC5" stroke-width="2" stroke-dasharray="3,3"/>
</svg>