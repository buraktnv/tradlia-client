<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Orthopedic - Bone with brace -->
  <rect x="20" y="20" width="160" height="160" rx="15" fill="#f0f9ff" stroke="#4CBEC5" stroke-width="3"/>
  <!-- Femur bone -->
  <path d="M100 35 L90 50 Q80 80 90 110 L110 145 Q120 160 110 165 L90 165 Q80 160 90 110 L100 50 Q110 80 110 110 L90 145 Q80 160 110 165" fill="#fdfdfd" stroke="#4CBEC5" stroke-width="3"/>
  <!-- Knee brace -->
  <rect x="75" y="95" width="50" height="30" rx="5" fill="#4CBEC5" opacity="0.3" stroke="#4CBEC5" stroke-width="2"/>
  <rect x="78" y="98" width="44" height="24" rx="3" fill="none" stroke="#4CBEC5" stroke-width="1" stroke-dasharray="5,5"/>
  <!-- Support straps -->
  <rect x="50" y="100" width="25" height="20" rx="3" fill="#4CBEC5" opacity="0.5"/>
  <rect x="125" y="100" width="25" height="20" rx="3" fill="#4CBEC5" opacity="0.5"/>
  <!-- Crutch -->
  <path d="M30 170 L30 60 Q30 50 40 50 L160 50" stroke="#4CBEC5" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="150" y="40" width="20" height="120" rx="3" fill="#4CBEC5" opacity="0.3"/>
  <line x1="30" y1="170" x2="30" y2="185" stroke="#4CBEC5" stroke-width="8" stroke-linecap="round"/>
</svg>