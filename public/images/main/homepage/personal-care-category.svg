<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <!-- Personal Care - Lotion bottle with leaf -->
  <rect x="20" y="20" width="260" height="260" rx="30" fill="#e8f5e9" stroke="#86bc25" stroke-width="4"/>
  <!-- Bottle -->
  <rect x="100" y="60" width="100" height="180" rx="10" fill="#c8e6c9" stroke="#86bc25" stroke-width="4"/>
  <rect x="110" y="70" width="80" height="30" rx="6" fill="#86bc25" opacity="0.3"/>
  <rect x="125" y="50" width="50" height="15" rx="5" fill="#86bc25"/>
  <!-- Pump -->
  <ellipse cx="150" cy="45" rx="20" ry="12" fill="#86bc25"/>
  <ellipse cx="150" cy="45" rx="14" ry="8" fill="#c8e6c9"/>
  <!-- Leaves -->
  <path d="M50 120 Q30 90 60 80 Q90 90 70 120 Z" fill="#86bc25" opacity="0.8"/>
  <path d="M250 120 Q270 90 240 80 Q210 90 230 120 Z" fill="#86bc25" opacity="0.8"/>
  <path d="M100 50 Q90 30 120 40 Q150 30 140 50 Z" fill="#86bc25" opacity="0.8"/>
  <path d="M200 50 Q210 30 180 40 Q150 30 160 50 Z" fill="#86bc25" opacity="0.8"/>
  <!-- Droplets -->
  <circle cx="120" cy="180" r="10" fill="#86bc25" opacity="0.6"/>
  <circle cx="180" cy="180" r="10" fill="#86bc25" opacity="0.6"/>
  <circle cx="150" cy="210" r="10" fill="#86bc25" opacity="0.6"/>
  <!-- Text -->
  <text x="150" y="280" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#86bc25" text-anchor="middle">Personal Care</text>
</svg>