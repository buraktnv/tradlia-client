  <!-- Bottle -->
  <rect x="75" y="50" width="50" height="100" rx="5" fill="#e0f7fa" stroke="#4CBEC5" stroke-width="3"/>
  <rect x="85" y="40" width="30" height="15" rx="3" fill="#4CBEC5"/>
