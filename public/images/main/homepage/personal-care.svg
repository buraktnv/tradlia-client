  <path d="M140 70 Q155 55 145 45 Q135 55 140 70" fill="#86bc25" opacity="0.8"/>
  <path d="M60 70 Q45 55 55 45 Q65 55 60 70" fill="#86bc25" opacity="0.8"/>
  <!-- Droplets -->
  <circle cx="85" cy="120" r="6" fill="#4CBEC5" opacity="0.6"/>
