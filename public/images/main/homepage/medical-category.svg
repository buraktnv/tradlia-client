<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <!-- Medical category - Stethoscope and cross -->
  <rect x="20" y="20" width="260" height="260" rx="30" fill="#f0f9ff" stroke="#4CBEC5" stroke-width="4"/>
  <!-- Stethoscope -->
  <path d="M60 180 Q60 140 100 140 L100 100" stroke="#4CBEC5" stroke-width="8" fill="none" stroke-linecap="round"/>
  <circle cx="100" cy="100" r="25" fill="none" stroke="#4CBEC5" stroke-width="6"/>
  <circle cx="100" cy="100" r="8" fill="#4CBEC5"/>
  <!-- Medical cross -->
  <rect x="180" y="160" width="20" height="80" rx="6" fill="#4CBEC5"/>
  <rect x="150" y="190" width="80" height="20" rx="6" fill="#4CBEC5"/>
  <!-- Heartbeat line -->
  <path d="M180 80 L180 60 Q190 55 200 60 Q210 65 220 60 Q230 55 240 60 Q250 65 260 60" stroke="#00ff88" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Pills -->
  <circle cx="60" cy="240" r="12" fill="#4CBEC5" opacity="0.8"/>
  <circle cx="90" cy="240" r="12" fill="#4CBEC5" opacity="0.6"/>
  <circle cx="120" cy="240" r="12" fill="#4CBEC5" opacity="0.4"/>
  <!-- Text -->
  <text x="150" y="280" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#4CBEC5" text-anchor="middle">Medical</text>
</svg>