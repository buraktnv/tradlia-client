<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Digital Health - Smartphone with medical app -->
  <rect x="20" y="20" width="160" height="160" rx="15" fill="#f0f9ff" stroke="#4CBEC5" stroke-width="3"/>
  <!-- Phone frame -->
  <rect x="55" y="35" width="90" height="150" rx="15" fill="#1a1a2e" stroke="#4CBEC5" stroke-width="3"/>
  <!-- Screen -->
  <rect x="60" y="45" width="80" height="130" rx="10" fill="#0f3460" stroke="#4CBEC5" stroke-width="1"/>
  <!-- App icon - Heart monitor -->
  <rect x="85" y="60" width="30" height="30" rx="8" fill="#4CBEC5" opacity="0.3"/>
  <path d="M90 75 Q95 70 100 75 Q103 80 105 75 Q108 68 110 75" stroke="#4CBEC5" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- App name -->
  <text x="100" y="105" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">MediApp</text>
  <!-- Heart rate -->
  <text x="100" y="120" font-family="Arial, sans-serif" font-size="12" fill="#00ff88" text-anchor="middle">72 BPM</text>
  <!-- Navigation bar -->
  <rect x="65" y="160" width="70" height="8" rx="4" fill="#4CBEC5" opacity="0.3"/>
  <!-- Camera notch -->
  <rect x="95" y="40" width="10" height="6" rx="3" fill="#4CBEC5" opacity="0.5"/>
  <!-- WiFi symbol -->
  <g stroke="#4CBEC5" stroke-width="1.5" fill="none" transform="translate(120, 50)">
    <path d="M0 15 Q5 7 10 15" opacity="0.8"/>
    <path d="M2 15 Q5 10 8 15" opacity="0.6"/>
    <path d="M4 15 Q5 12 6 15" opacity="0.4"/>
    <circle cx="5" cy="15" r="1" fill="#4CBEC5" opacity="0.8"/>
  </g>
  <!-- Battery -->
  <rect x="135" y="45" width="12" height="6" rx="1" stroke="#4CBEC5" stroke-width="1.5" fill="none"/>
  <rect x="147" y="47" width="2" height="2" fill="#4CBEC5"/>
  <rect x="137" y="47" width="8" height="2" fill="#4CBEC5"/>
</svg>