<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <!-- Supplements category - Vitamin bottles -->
  <rect x="20" y="20" width="260" height="260" rx="30" fill="#fef9e7" stroke="#FFBE00" stroke-width="4"/>
  <!-- Bottle 1 -->
  <rect x="50" y="70" width="55" height="150" rx="8" fill="#fff8e1" stroke="#FFBE00" stroke-width="3"/>
  <rect x="55" y="75" width="45" height="25" rx="4" fill="#FFBE00" opacity="0.3"/>
  <rect x="65" y="180" width="35" height="15" rx="3" fill="#FFBE00" opacity="0.3"/>
  <!-- Bottle 2 -->
  <rect x="125" y="60" width="60" height="160" rx="8" fill="#fff8e1" stroke="#FFBE00" stroke-width="3"/>
  <rect x="130" y="65" width="50" height="25" rx="4" fill="#FFBE00" opacity="0.3"/>
  <rect x="140" y="185" width="40" height="15" rx="3" fill="#FFBE00" opacity="0.3"/>
  <!-- Bottle 3 -->
  <rect x="205" y="80" width="50" height="130" rx="8" fill="#fff8e1" stroke="#FFBE00" stroke-width="3"/>
  <rect x="210" y="85" width="40" height="20" rx="3" fill="#FFBE00" opacity="0.3"/>
  <rect x="220" y="175" width="30" height="15" rx="3" fill="#FFBE00" opacity="0.3"/>
  <!-- Capsules -->
  <ellipse cx="150" cy="240" rx="15" ry="8" fill="#FFBE00" opacity="0.8"/>
  <ellipse cx="130" cy="240" rx="15" ry="8" fill="#FFBE00" opacity="0.6"/>
  <ellipse cx="170" cy="240" rx="15" ry="8" fill="#FFBE00" opacity="0.4"/>
  <!-- Text -->
  <text x="150" y="280" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFBE00" text-anchor="middle">Supplements</text>
</svg>