<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Dental - Tooth with tools -->
  <rect x="20" y="20" width="160" height="160" rx="15" fill="#f0f9ff" stroke="#4CBEC5" stroke-width="3"/>
  <!-- Tooth -->
  <path d="M100 40 L130 50 L130 110 Q130 130 100 140 Q70 130 70 110 L70 50 Z" fill="#ffffff" stroke="#4CBEC5" stroke-width="3"/>
  <!-- Mirror -->
  <circle cx="100" cy="90" r="20" fill="#e0f7fa" stroke="#4CBEC5" stroke-width="2"/>
  <circle cx="100" cy="90" r="10" fill="#4CBEC5" opacity="0.2"/>
  <!-- Probe -->
  <path d="M50 130 Q65 115 80 100" stroke="#4CBEC5" stroke-width="4" fill="none" stroke-linecap="round"/>
  <circle cx="50" cy="130" r="4" fill="#4CBEC5"/>
  <!-- Scaler -->
  <path d="M150 130 Q135 115 120 100" stroke="#4CBEC5" stroke-width="4" fill="none" stroke-linecap="round"/>
  <circle cx="150" cy="130" r="4" fill="#4CBEC5"/>
  <!-- Light -->
  <path d="M100 25 L100 35" stroke="#4CBEC5" stroke-width="4" stroke-linecap="round"/>
  <polygon points="95,35 105,35 100,25" fill="#4CBEC5"/>
</svg>